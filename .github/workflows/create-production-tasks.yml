name: Create production tasks
on:
  workflow_dispatch:
    inputs:
      episode:
        description: Episode ID
        required: true
        type: string
      plan_commit:
        description: Exact default branch SHA from reviewed plan
        required: true
        type: string
      dry_run:
        description: Preview only
        default: true
        type: boolean
      confirmed:
        description: I confirm creating the reviewed tasks
        default: false
        type: boolean
permissions:
  contents: read
  issues: read
concurrency:
  group: goody-production-${{ inputs.episode }}
  cancel-in-progress: false
jobs:
  preview:
    if: inputs.dry_run && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/sync_tasks.py --episode "$EPISODE" --commit "$PLAN_COMMIT"
        env:
          EPISODE: ${{ inputs.episode }}
          PLAN_COMMIT: ${{ inputs.plan_commit }}
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-${{ github.run_id }}
          path: reports/
  create:
    if: inputs.dry_run == false && inputs.confirmed && github.ref_name == github.event.repository.default_branch
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/sync_tasks.py --episode "$EPISODE" --commit "$PLAN_COMMIT" --write --confirmed
        env:
          EPISODE: ${{ inputs.episode }}
          PLAN_COMMIT: ${{ inputs.plan_commit }}
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creation-${{ github.run_id }}
          path: reports/
